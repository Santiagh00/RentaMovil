# Server
server.port=8081

# H2 Database (en memoria para desarrollo)
spring.datasource.url=jdbc:h2:mem:rentamovil;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Consola H2 (para ver la BD en navegador)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT - Usar variables de entorno en producción
jwt.secret=${JWT_SECRET:RentaMovil2024SecretKeyMuyLargaParaSeguridadMinimo32Caracteres}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Logging - NO usar DEBUG en producción (expone credenciales y tokens)
logging.level.org.springframework.security=INFO

# Rate Limiting
rate-limit.login.max-attempts=5
rate-limit.login.window-ms=60000
rate-limit.api.max-requests=60
rate-limit.api.window-ms=60000